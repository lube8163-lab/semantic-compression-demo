<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Semantic Communication v1.4 SAFE</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      margin: 0;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 10px 20px;
      font-weight: bold;
      font-size: 20px;
      position: sticky;
      top: 0;
    }
    #container {
      max-width: 600px;
      margin: 20px auto;
    }
    #postForm {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .post {
      background: #fff;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .post-header {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }
    button {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
    }
  </style>
</head>

<body>
<header>Semantic Communication v1.4 SAFE</header>

<div id="container">
  <form id="postForm">
    <input type="file" id="imageInput" accept="image/*" />
    <br /><br />
    <button type="submit">意味送信（投稿）</button>
  </form>

  <div id="timeline"></div>
</div>

<script>
  const WORKER_URL = "https://semantic-worker.semantic-compression.workers.dev";
  const APP_KEY = "semantic-demo-v1"; // ← Worker と一致させる
  const MAX_POSTS = 10;

  const form = document.getElementById("postForm");
  const timeline = document.getElementById("timeline");
  const imageInput = document.getElementById("imageInput");

  /* =========================
     🧼 XSS 対策
  ========================== */
  function escapeHTML(str) {
    return str.replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));
  }

  /* =========================
     🖼️ 投稿履歴
  ========================== */
  window.onload = () => {
    const posts = JSON.parse(localStorage.getItem("posts")) || [];
    posts.reverse().forEach(addPostToTimeline);
  };

  /* =========================
     ✉️ 投稿処理
  ========================== */
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = imageInput.files[0];

    if (!file) {
      alert("画像を選んでね！");
      return;
    }

    // 🔒 フロント側バリデーション
    if (!file.type.startsWith("image/")) {
      alert("画像ファイルのみ対応しています");
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("5MB以下の画像にしてね");
      return;
    }

    resizeImage(file, 800, 800, async (_, blob) => {
      try {
        addTemporaryPost();

        const formData = new FormData();
        formData.append("file", blob, "upload.jpg");

        const res = await fetch(WORKER_URL + "/auto", {
          method: "POST",
          headers: {
            "X-App-Key": APP_KEY,
          },
          body: formData,
        });

        if (!res.ok) throw new Error("Upload failed");

        const data = await res.json();
        savePost(data.caption, data.imageUrl);
        form.reset();

      } catch (err) {
        console.error(err);
        alert("投稿に失敗しました");
        removeTemporaryPost();
      }
    });
  });

  /* =========================
     🧠 UI ヘルパー
  ========================== */
  function addTemporaryPost() {
    const div = document.createElement("div");
    div.className = "post";
    div.id = "tempPost";
    div.innerHTML = `
      <div class="post-header">生成中...</div>
      <p>AIが意味を解析しています…</p>
    `;
    timeline.prepend(div);
  }

  function removeTemporaryPost() {
    const temp = document.getElementById("tempPost");
    if (temp) temp.remove();
  }

  function savePost(caption, imageUrl) {
    let posts = JSON.parse(localStorage.getItem("posts")) || [];
    const now = new Date();

    const post = {
      user: "user_" + now.getHours() + now.getMinutes(),
      time: now.toLocaleString(),
      caption: escapeHTML(caption),
      image: imageUrl,
    };

    posts.unshift(post);
    posts = posts.slice(0, MAX_POSTS);
    localStorage.setItem("posts", JSON.stringify(posts));

    removeTemporaryPost();
    addPostToTimeline(post);
  }

  function addPostToTimeline(post) {
    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="post-header">@${post.user} ・ ${post.time}</div>
      <p>${post.caption}</p>
      <img src="${post.image}" alt="AI生成画像" />
    `;
    timeline.prepend(div);
  }

  /* =========================
     🖼️ 画像圧縮
  ========================== */
  function resizeImage(file, maxW, maxH, cb) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;

        if (width > maxW) {
          height *= maxW / width;
          width = maxW;
        }
        if (height > maxH) {
          width *= maxH / height;
          height = maxH;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);

        canvas.toBlob(blob => cb(null, blob), "image/jpeg", 0.7);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
